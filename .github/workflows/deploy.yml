name: Spring Boot build and deploy

on:
  push:
    branches:
      - dev
env:
  IMAGE_NAME: spring-boot-app

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Setting Up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Jar
        run: mvn clean package -version1Test

      - name: Building docker image
        run: docker run -t ${{secrets.DOCKER_USERNAME}}/{{env."IMAGE_NAME"}}:latest .

      - name: Login To Dockerhub
        uses: docker/login-action@v4
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Image
        run: docker push ${{secrets.DOCKER_USERNAME}}/{{env."IMAGE_NAME"}}:latest

      - name: Deploy To EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST}}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            docker pull ${{secrets.DOCKER_USERNAME}}/{{env."IMAGE_NAME"}}:latest
            docker stop spring-boot-app || true
            docker rm spring-boot-app || true
            docker run -d --name spring-boot-app --restart unless-stopped -p 8080:8080 ${{secrets.DOCKER_USERNAME}}/{{env.IMAGE_NAME}}:latest
            docker image prune -f
            
